<!DOCTYPE html>
    <html lang="en">
        <head>
            <title>Marks Table</title>
        </head>

        <body>
            <table border="5px" cellpadding="10px">
                <caption>Student Marks</caption>
                
                <tr><th colspan="2">Student Mark</th></tr>
                <tr><td>50</td><td>Peter</td></tr>
                <tr><td>60</td><td>John</td></tr>
                <tr><td>70</td><td>Jack</td></tr>
                <tr><td>85</td><td>Ann</td></tr>
            </table>
        </body>
    </html>
